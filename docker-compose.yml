services:
  # ============================================================
  # PostgreSQL Database
  # ============================================================
  db:
    image: postgres:16.10-alpine
    container_name: jerney-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    # Do NOT expose PostgreSQL to the EC2 host/public network.
    # Backend accesses it through the internal Docker network.
    expose:
      - "5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    # PostgreSQL needs some capabilities depending on image/runtime,
    # so don't blindly drop everything here until tested.
    tmpfs:
      - /tmp

    # Resource limits
    mem_limit: 512m
    cpus: "1.0"


  # ============================================================
  # Backend API
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: jerney-backend
    restart: unless-stopped

    environment:
      PORT: "5000"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}

    # Only accessible by other containers.
    expose:
      - "5000"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - backend
      - frontend

    security_opt:
      - no-new-privileges:true

    read_only: true

    tmpfs:
      - /tmp

    cap_drop:
      - ALL

    mem_limit: 256m
    cpus: "0.5"


  # ============================================================
  # Frontend
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: jerney-frontend
    restart: unless-stopped

    ports:
      - "80:8080"

    depends_on:
      - backend

    networks:
      - frontend

    security_opt:
      - no-new-privileges:true

    read_only: true

    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

    cap_drop:
      - ALL

    mem_limit: 128m
    cpus: "0.5"


# ============================================================
# Networks
# ============================================================
networks:
  frontend:
    driver: bridge

  backend:
    driver: bridge
    internal: true


# ============================================================
# Persistent Storage
# ============================================================
volumes:
  pgdata:
    driver: local